<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ff7a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>どうぶつレスキュー</title>
  </head>
  <body>
    <div class="pad">
      <header class="pad-top">
        <svg class="emblem" viewBox="0 0 100 110" aria-hidden="true">
          <path d="M50 4 92 18v34c0 28-18 46-42 54C26 98 8 80 8 52V18z" fill="#ffd23f" stroke="#fff" stroke-width="6" />
          <path d="M50 24l8.2 17.5 19.2 2.3-14.2 13.1 3.8 19L50 66.4 33 75.9l3.8-19L22.6 43.8l19.2-2.3z" fill="#ff5a1f" />
        </svg>
        <span class="pad-name">どうぶつレスキュー</span>
        <button id="gear" class="gear" aria-label="保護者メニュー（3秒長押し）">
          <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
          <span class="ring"></span>
        </button>
      </header>

      <main class="pad-screen">
        <!-- 電源オフ：まんなかの星を押すと起動 -->
        <section id="off" class="screen off">
          <button id="power" class="power" aria-label="スイッチオン">
            <svg viewBox="0 0 100 100"><path d="M50 8l12.4 26.4 28.9 3.5-21.3 19.8 5.6 28.6L50 72.1 24.4 86.3 30 57.7 8.7 37.9l28.9-3.5z" /></svg>
          </button>
          <p class="hint">おしてね</p>
        </section>

        <!-- メニュー：隊員を呼ぶ・ミッション・バッジ -->
        <section id="menu" class="screen" hidden>
          <div id="members" class="members"></div>
          <div class="menu-bottom">
            <button id="sos" class="big-btn sos" aria-label="しゅつどう ミッション">
              <span class="lamp"></span><span>SOS</span>
            </button>
            <button id="toBadges" class="big-btn badge-btn" aria-label="バッジ">
              <img data-img="sports_medal" alt="" /><span id="badgeCount" class="count"></span>
            </button>
          </div>
        </section>

        <!-- 隊員を呼び出す -->
        <section id="call" class="screen call" hidden>
          <div class="radar"><i></i><i></i><i></i>
            <div class="avatar big"><img alt="" /></div>
          </div>
          <div class="call-name"></div>
          <div class="bubble" hidden></div>
          <button id="go" class="big-btn go" hidden>しゅつどう！</button>
        </section>

        <!-- ミッション：困っている絵を見て、だれを呼ぶか選ぶ -->
        <section id="mission" class="screen mission" hidden>
          <div class="alert">SOS</div>
          <div class="trouble"></div>
          <div class="trouble-text"></div>
          <div class="choices"></div>
        </section>

        <!-- ミッション成功 -->
        <section id="clear" class="screen clear" hidden>
          <div class="clear-title">ミッション せいこう！</div>
          <div class="medal"></div>
          <div class="clear-buttons">
            <button id="next" class="big-btn sos small"><span class="lamp"></span><span>つぎ</span></button>
            <button id="home" class="big-btn home" aria-label="もどる">
              <svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z" /></svg>
            </button>
          </div>
        </section>

        <!-- バッジ一覧 -->
        <section id="badges" class="screen" hidden>
          <div class="badge-grid"></div>
        </section>

        <button class="back" aria-label="もどる" hidden>
          <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" /></svg>
        </button>
      </main>

      <div class="pad-bottom"><span></span><span></span><span></span></div>
    </div>

    <!-- 出動：のりものが画面を走りぬける -->
    <div id="drive" class="drive" hidden>
      <div class="road"></div>
      <div class="car"><img alt="" /><div class="rider"><img alt="" /></div></div>
    </div>

    <!-- 保護者メニュー -->
    <div id="parent" class="parent" hidden>
      <div class="panel">
        <h2>保護者メニュー</h2>
        <div class="row">
          <span>音量</span>
          <div class="seg" data-key="volume">
            <button data-v="0">なし</button><button data-v="1">小さめ</button><button data-v="2">ふつう</button>
          </div>
        </div>
        <div class="row">
          <span>ミッションの隊員の数</span>
          <div class="seg" data-key="choices">
            <button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button>
          </div>
        </div>
        <div class="row">
          <span>バッジ</span>
          <button id="reset" class="plain">ぜんぶ消す</button>
        </div>
        <button id="close" class="plain wide">とじる</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
