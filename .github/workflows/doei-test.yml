# 一時的：doei の読み方の候補を作る
name: doei-test
on:
  push:
    branches: [zukan-doei-test]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          K: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          mkdir -p out; i=0
          for v in 'Chirp3-HD-Aoede|Doei, doei!' 'Chirp3-HD-Aoede|Doei doei.' 'Chirp3-HD-Aoede|Doeeei!' 'Chirp3-HD-Leda|Doei!' 'Chirp3-HD-Leda|Doei, doei!' 'Wavenet-F|Doei!' 'Wavenet-F|Doei, doei!'; do
            i=$((i+1)); n="${v%%|*}"; t="${v#*|}"
            curl -sf "https://texttospeech.googleapis.com/v1/text:synthesize?key=$K" -H 'Content-Type: application/json' \
              -d "{\"input\":{\"text\":\"$t\"},\"voice\":{\"languageCode\":\"nl-NL\",\"name\":\"nl-NL-$n\"},\"audioConfig\":{\"audioEncoding\":\"MP3\",\"sampleRateHertz\":24000}}" \
              | jq -r .audioContent | base64 -d > "out/$i.mp3"
            echo "$i $n $t" >> out/list.txt
          done
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add out && git commit -qm out && git push -q -f origin HEAD:zukan-doei-out
