# 一時的：音声ファイルの読み方を文字起こしで確認する
name: reading-check
on:
  push:
    branches: [zukan-reading-check]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [zukan-voices-5, zukan-voices-6, zukan-voices-7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/checkout@v4
        with:
          path: tool
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null && pip install -q faster-whisper pykakasi
      - run: set -o pipefail; python tool/check.py dutch-zukan/src/voice | tee -a "$GITHUB_STEP_SUMMARY"
