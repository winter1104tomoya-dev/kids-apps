# main に変更が入るたびに、2つのアプリをビルドして GitHub Pages に公開する
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: |
          for app in nazori-app dutch-zukan; do
            (cd $app && npm ci && npm run build)
          done
          mkdir _site
          cp site/index.html _site/
          cp -r nazori-app/dist _site/nazori
          cp -r dutch-zukan/dist _site/zukan
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
